# CI — thin caller of the org-wide reusable pipeline (bymaxone/.github).
#
# The generic library jobs (lint, typecheck, unit+coverage, mutation) run via
# node-lib-ci.yml. This library's extra verification (type-level API tests, build
# output integrity, bundle-size budget) and its real-Redis Testcontainers e2e stay
# here. Mutation runs only on a push to main / manual dispatch, never on PRs.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: bymaxone/.github/.github/workflows/node-lib-ci.yml@v1
    with:
      run-format-check: false # no format:check script; prettier runs via lint/pre-commit
      run-build: false # build + integrity + size verified in the `verify` job below
      unit-command: pnpm test:cov:all
      run-mutation: true
      mutation-source-globs: '^(src/)'

  # Library-specific verification: type-level API tests, full build, output
  # integrity across every subpath, and the brotli bundle-size budget.
  verify:
    name: Verify build + size + type API
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: Type-level API tests
        run: pnpm test:types
      - name: Build all subpaths
        run: pnpm build
      - name: Verify build output integrity
        run: |
          for subpath in server shared; do
            for ext in mjs cjs d.ts d.cts; do
              if [ ! -f "dist/$subpath/index.$ext" ]; then
                echo "Missing dist/$subpath/index.$ext"
                exit 1
              fi
            done
          done
          echo "Both subpaths produced ESM + CJS + .d.ts + .d.cts"
      - name: Bundle size budget
        run: pnpm size

  e2e:
    name: E2E (Testcontainers · redis:8-alpine)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: bymaxone/.github/.github/actions/setup-node-pnpm@v1
      - name: End-to-end tests (real Redis + cluster)
        run: pnpm test:e2e
        env:
          REDIS_IMAGE: redis:8-alpine

  security:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    uses: bymaxone/.github/.github/workflows/security.yml@v1
    with:
      fail-on-severity: high
