# Keeps the shared half of AGENTS.md in step with the canonical copy in
# bymaxone/.github. The rules that must not vary between Bymax repositories are
# edited there; everything this repository writes for itself lives outside the
# markers and is never touched.
#
# Codex reads AGENTS.md from the file tree of the repository under review, so a
# shared rule has to exist as a real file here rather than be referenced. It does
# not read CLAUDE.md, .github/copilot-instructions.md or .github/instructions/.
# That is why this is a sync and not a `uses:` — the reusable CI elsewhere in
# this directory propagates by reference, this one has to propagate by commit.
name: agents-sync

on:
  schedule:
    # Weekly on TUESDAY, read off this repository's own schedule rather than
    # copied: Monday already carries scorecard (04:00), mutation-full (04:33),
    # codeql (06:00) and peer-advisory-drift (06:17), and Wednesday carries the
    # OSV scan (06:42). Tuesday is empty, so this run competes with nothing.
    - cron: '23 7 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    # Referenced by the moving alias rather than pinned, which is the convention
    # for first-party reusables and the rule the shared block itself states.
    uses: bymaxone/.github/.github/workflows/agents-sync.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets:
      # The GitHub App, named rather than `inherit` so the called workflow
      # receives these two and not every secret this repository holds.
      #
      # The pair is read together: the reusable errors out when exactly one is
      # set rather than falling back, because a silent fallback is how a caller
      # ends up looking configured while running on the default token.
      #
      # `sync-token` is left deliberately UNMAPPED. It is still a declared,
      # optional input of the reusable, so mapping it would be valid YAML and
      # would be accepted — and a secret that does not exist resolves to the
      # empty string, which the reusable treats as "not supplied" and falls back
      # from. The mapping would read as configured while contributing nothing —
      # which is precisely the line a reader adds back for safety, because a
      # named secret looks like the careful choice and a blank looks like a gap.
      #
      # Why the credential matters at all: a pull request opened with the default
      # GITHUB_TOKEN starts no workflow runs, so an unattended sync PR can never
      # satisfy required checks and cannot merge — and this repository's ruleset
      # requires eight.
      app-id: ${{ secrets.AGENTS_SYNC_APP_ID }}
      app-private-key: ${{ secrets.AGENTS_SYNC_PRIVATE_KEY }}
