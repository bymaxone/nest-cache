# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # Reached through jest-haste-map 30.5.0, which lists it as a direct dependency;
  # 30.4.1 does not, which is why the entry is needed only from that bump onward.
  # The package ships a prebuilt binary per platform as optional dependencies, so
  # its build script is the compile-from-source fallback rather than the normal
  # path. Denied because no pipeline job here runs watch mode at all — `test:watch`
  # is a local convenience — so compiling a native watcher buys the pipeline nothing.
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
  # Denied on purpose: optional native builds reached transitively that
  # nothing here executes. Recording them as `false` states the decision,
  # where leaving them out would only state that nobody looked.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  'esbuild': '^0.28.1'
  'fast-uri': '^3.1.5'
  'js-yaml@3': '^3.15.1'
  'js-yaml@4': '^4.3.1'
  'protobufjs': '^7.6.5'
  'qs': '^6.15.2'
  'undici': '^7.28.0'
