# Build scripts are denied by default; an unlisted package counts as unreviewed.
# `allowBuilds` is the only spelling pnpm 11 reads: onlyBuiltDependencies,
# neverBuiltDependencies and their siblings were removed in v11 and replaced by
# this map. Without an entry, `pnpm install` exits with ERR_PNPM_IGNORED_BUILDS
# rather than warning.
allowBuilds:
  # Reached through jest-haste-map 30.5.0, which lists it as a direct dependency;
  # 30.4.1 does not, which is why the entry is needed only from that bump onward.
  # Denied because the script does nothing to deny: `install` runs
  # scripts/build-from-source.js, whose entire body is
  # `if (process.env.npm_config_build_from_source === 'true') { build() }`, so a
  # normal install compiles nothing and the prebuilt per-platform binary — shipped
  # as optional dependencies — is what gets used either way. The entry exists
  # because pnpm 11 exits on an unlisted build script rather than warning, not
  # because allowing this one would have cost anything.
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: true
  # Denied on purpose: optional native builds reached transitively that
  # nothing here executes. Recording them as `false` states the decision,
  # where leaving them out would only state that nobody looked.
  cpu-features: false
  protobufjs: false
  ssh2: false

# Forced versions for vulnerable transitive dev dependencies. These live here and
# NOT in package.json: pnpm 11 no longer reads the `pnpm` field of package.json, so
# an override placed there does nothing — it warns, but it does nothing.
overrides:
  # GHSA-73wf-gq98-2v4g and GHSA-c83g-rgw3-j3cx, both CVSS 7.5, both first patched
  # in 4.28.7: an uncaught crash reachable through a prototype write, and unbounded
  # memory growth from a cache that never evicts. Reached dev-only, through
  # @stryker-mutator/* -> @babel/core -> @babel/helper-compilation-targets, which
  # asks for `^4.24.0` and so accepts the patched line unchanged. Patched rather
  # than ignored because the fix is a floor on a transitive dev dependency that
  # nothing here pins, which costs nothing to raise.
  'browserslist': '^4.28.7'
  # GHSA-8r5x-fm3f-whwj (9.8), GHSA-p8wg-vrv2-v86f (9.2), GHSA-xw65-4hp5-5hc7 (4.7): fixed
  # in 4.7.10. Dev-only, via ts-jest, which asks for a range that already admits it.
  'handlebars': '^4.7.10'
  # GHSA-f596-whhp-79r4 (3.7), GHSA-m9gg-hp2v-232j (7.4): fixed in 1.14.5. Dev-only, via
  # dockerode -> testcontainers.
  '@grpc/grpc-js': '^1.14.5'
  'brace-expansion@1': '^1.1.18'
  # GHSA-6j4f-fj2g-mc7p (7.5), GHSA-qhr7-859c-m2p7 (7.5), GHSA-q2hr-2g5m-vwhr (5.3):
  # floors at the last of the three fixes per line (2.1.7, 5.0.12). Dev-only, reached
  # through minimatch/glob in the jest, eslint and stryker toolchains. Raise or drop
  # once those toolchains resolve a patched line on their own.
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '^5.0.12'
  'esbuild': '^0.28.1'
  # Four advisories at CVSS 7.5, all fixed in 3.1.6 and all against `>= 3.1.3 < 3.1.6`:
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf, GHSA-jqff-g426-hqxp.
  # The first is host confusion from IDN canonicalisation being skipped while parsing
  # an authority; the scanner reports the set together.
  #
  # The floor was already `^3.1.5` and already admitted 3.1.6 — and protected nothing,
  # because a caret in an override is a floor on resolution, not a standing instruction
  # to re-resolve. The lockfile kept 3.1.5 from the day the entry was written. Read the
  # resolved version, never the presence of an entry.
  #
  # Raised again for GHSA-58mr-gqgx-xq4g and GHSA-qw65-cvwx-89v3 (7.5), GHSA-hrr3-gc8f-f4qj
  # (4.8), GHSA-w74x-v6f9-j3xg (6.1), GHSA-wjr9-j795-jxcr (4.8), GHSA-333x-w4r6-6crp and
  # GHSA-xhq7-xmqj-769h (3.7): the last of them is fixed in 3.1.9. Dev-only, via ajv in
  # the eslint toolchain.
  'fast-uri': '^3.1.9'
  # GHSA-2883-xcg3-v3hh (7.5): maxTotalMergeKeys does not bound CPU use for empty merge
  # sources; fixed in 3.15.2 and 4.3.2. Dev-only, via the istanbul/jest and eslint chains.
  'js-yaml@3': '^3.15.2'
  'js-yaml@4': '^4.3.2'
  'protobufjs': '^7.6.5'
  # GHSA-4mjr-xmp4-gh2g and GHSA-x5fp-wj9c-mxmx: denial of service through an
  # attacker-controlled `isBuffer`. Vulnerable `>= 2.2.5 < 6.16.0` and
  # `>= 6.14.2 <= 6.15.3`; the lockfile held 6.15.3, inside both. Scored 5.3 and 3.7
  # by GitHub and 6.3 by OSV — named with their source because the two disagree and
  # this repository's gate is the OSV one.
  #
  # Same stale-floor shape as fast-uri above: `^6.15.2` already admitted the fix.
  #
  # GHSA-6pq8-jhm2-2vcw (6.3): fixed in 6.16.1.
  'qs': '^6.16.1'
  # GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm and nine more (up to 7.4): all fixed by 7.30.1.
  # Dev-only, via testcontainers.
  'undici': '^7.30.1'
